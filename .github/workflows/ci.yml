name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8==7.3.0

      - name: Run tests
        run: python -m pytest -q

      - name: Run lint
        run: python -m flake8 src tests --select=E9,F63,F7,F82 --show-source --statistics

  migrations:
    name: Database migrations (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_migrate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://gym:gym@localhost:5432/gym_migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply every migration
        run: python -m alembic upgrade head

      - name: Revert and re-apply the newest migration
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Compare the models with the migrated schema
        run: python -m alembic check

      - name: Check the notification kinds accepted by the database
        run: |
          python - <<'PY'
          import os
          import psycopg

          database_url = os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://", 1)
          with psycopg.connect(database_url) as connection:
              definition = connection.execute(
                  "select pg_get_constraintdef(oid) from pg_constraint "
                  "where conname = 'ck_member_notifications_kind'"
              ).fetchone()[0]
          if "equipment_out_of_service" not in definition:
              raise SystemExit(f"ck_member_notifications_kind sin el tipo de equipo: {definition}")
          print(definition)
          PY

  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
